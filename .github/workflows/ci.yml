name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

  package-linux:
    name: Package Linux artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Debian and AppImage packages
        run: npm run package:linux

      - name: Inspect Debian package metadata
        run: |
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb | grep -E 'usr/share/applications|usr/share/icons'

      - name: Verify AppImage extraction fallback
        run: |
          chmod +x release/*.AppImage
          timeout 30s ./release/*.AppImage --appimage-extract-and-run --version || test $? -eq 124

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discdock-linux
          path: |
            release/*.deb
            release/*.AppImage

  package-arch:
    name: Package Arch Linux artifact
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm git

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pacman package as an unprivileged user
        run: |
          useradd --create-home packagebuilder
          chown -R packagebuilder:packagebuilder "$GITHUB_WORKSPACE"
          su packagebuilder --shell /bin/bash --command "cd '$GITHUB_WORKSPACE' && PATH='$PATH' npm run package:arch"

      - name: Inspect Arch package metadata
        run: |
          pacman -Qip release/*.pacman
          pacman -Qip release/*.pkg.tar.zst

      - name: Smoke-test Arch install and removal
        run: |
          pacman -S --noconfirm desktop-file-utils
          pacman -U --noconfirm --nodeps --noscriptlet release/*.pkg.tar.zst
          test -x /opt/DiscDock/discdock
          test -x /usr/bin/discdock
          test -s /usr/share/icons/hicolor/256x256/apps/discdock.png
          desktop-file-validate /usr/share/applications/discdock.desktop
          pacman -Qkk discdock | grep -q '0 altered files'
          pacman -U --noconfirm --nodeps release/*.pkg.tar.zst
          if unshare --user true; then
            test "$(stat -c '%a' /opt/DiscDock/chrome-sandbox)" = 755
          else
            test "$(stat -c '%a' /opt/DiscDock/chrome-sandbox)" = 4755
          fi
          pacman -Rns --noconfirm --nodeps discdock
          test ! -e /opt/DiscDock/discdock
          test ! -e /usr/bin/discdock

      - name: Verify AUR metadata
        run: |
          cd packaging/aur/discdock
          makepkg --printsrcinfo > /tmp/discdock-srcinfo
          diff -u .SRCINFO /tmp/discdock-srcinfo

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: discdock-arch
          path: |
            release/*.pacman
            release/*.pkg.tar.zst
