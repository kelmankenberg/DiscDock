name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

  package-linux:
    name: Package Linux artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Debian and AppImage packages
        run: npm run package:linux

      - name: Inspect Debian package metadata
        run: |
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb | grep -E 'usr/share/applications|usr/share/icons'

      - name: Verify AppImage extraction fallback
        run: |
          chmod +x release/*.AppImage
          timeout 30s ./release/*.AppImage --appimage-extract-and-run --version || test $? -eq 124

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discdock-linux
          path: |
            release/*.deb
            release/*.AppImage
